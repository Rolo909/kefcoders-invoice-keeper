openapi: 3.1.0
info:
  title: Invoice Keeper API
  description: |-
    Напоминания о регулярных платежах: аренда, подписки, серверы.

    **Авторизация.** `POST /api/v1/auth/login` → скопируйте `access_token` → кнопка **Authorize**.
    Веб-панель использует тот же вход, токен хранится в HttpOnly-cookie.

    **Роли.** Администратор (задаётся в `.env`) управляет платежами и пользователями.
    Пользователь видит платежи, отмечает оплату и исправляет фактическую дату.

    **Ошибки** — всегда `{"detail": "текст для пользователя", "code": "машинный код"}`.
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Проверка работоспособности API и базы данных
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Вход по логину и паролю
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '401':
          description: Неверный логин или пароль
        '429':
          description: Слишком много неудачных попыток входа
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - auth
      summary: Изменение своей почты и напоминаний на почту
      operationId: update_me_api_v1_auth_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '403':
          description: Администратор из .env не меняется через панель
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Завершение текущей сессии
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /api/v1/recurring-payments:
    get:
      tags:
      - recurring-payments
      summary: Получение списка регулярных платежей
      operationId: list_payments_api_v1_recurring_payments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Показать и прекращённые платежи
          default: false
          title: Include Deleted
        description: Показать и прекращённые платежи
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          title: Currency
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          description: Поиск по названию
          title: Q
        description: Поиск по названию
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Размер страницы
          default: 50
          title: Limit
        description: Размер страницы
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Сколько записей пропустить
          default: 0
          title: Offset
        description: Сколько записей пропустить
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
          title: Team Id
        description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RecurringPaymentOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - recurring-payments
      summary: Создание регулярного платежа
      description: Если срок ближе, чем за REMIND_DAYS_BEFORE дней, напоминание уходит сразу.
      operationId: create_payment_api_v1_recurring_payments_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recurring-payments/{payment_id}:
    get:
      tags:
      - recurring-payments
      summary: Получение регулярного платежа со всеми периодами
      operationId: get_payment_api_v1_recurring_payments__payment_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Payment Id
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
          title: Team Id
        description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentDetailOut'
        '404':
          description: Платёж не найден
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - recurring-payments
      summary: Прекращение регулярного платежа и его напоминаний с сохранением истории
      operationId: stop_payment_api_v1_recurring_payments__payment_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Payment Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Платёж не найден
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences:
    get:
      tags:
      - payment-occurrences
      summary: Получение списка платежей (периодов), в том числе оплаченных и просроченных
      operationId: list_occurrences_api_v1_payment_occurrences_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceStatus'
          - type: 'null'
          title: Status
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: true — только просроченные, false — без просрочки
          title: Overdue
        description: true — только просроченные, false — без просрочки
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceState'
          - type: 'null'
          title: State
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок не раньше
          title: Date From
        description: Срок не раньше
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок не позже
          title: Date To
        description: Срок не позже
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/Currency'
          - type: 'null'
          description: 'Можно повторять: currency=RUB&currency=USD'
          title: Currency
        description: 'Можно повторять: currency=RUB&currency=USD'
      - name: recurring_payment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Recurring Payment Id
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - due_date
          - -due_date
          - amount
          - -amount
          - days_overdue
          - -days_overdue
          type: string
          default: due_date
          title: Sort
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Размер страницы
          default: 50
          title: Limit
        description: Размер страницы
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Сколько записей пропустить
          default: 0
          title: Offset
        description: Сколько записей пропустить
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
          title: Team Id
        description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_OccurrenceOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{occurrence_id}:
    get:
      tags:
      - payment-occurrences
      summary: Получение конкретного платежа (периода) с историей изменений и напоминаниями
      operationId: get_occurrence_api_v1_payment_occurrences__occurrence_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Occurrence Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceDetailOut'
        '404':
          description: Период не найден
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - payment-occurrences
      summary: Подтверждение или отмена оплаты, исправление фактической даты оплаты
      operationId: update_occurrence_api_v1_payment_occurrences__occurrence_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Occurrence Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrenceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '404':
          description: Период не найден
        '409':
          description: already_paid — период уже оплачен (кем и когда — в detail); not_paid — дату можно менять только у оплаченного
            периода
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payments/summary:
    get:
      tags:
      - payments
      summary: Получение итоговых сумм платежей по валютам
      operationId: summary_api_v1_payments_summary_get
      security:
      - HTTPBearer: []
      parameters:
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Начало периода; по умолчанию — 1-е число текущего месяца
          title: Date From
        description: Начало периода; по умолчанию — 1-е число текущего месяца
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Конец периода; по умолчанию — конец текущего месяца
          title: Date To
        description: Конец периода; по умолчанию — конец текущего месяца
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Итоги на дату; по умолчанию — сегодня
          title: As Of
        description: Итоги на дату; по умолчанию — сегодня
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
          title: Team Id
        description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payments/calendar:
    get:
      tags:
      - payments
      summary: 'Календарь оплат на месяц: сроки по дням, включая плановые'
      operationId: calendar_api_v1_payments_calendar_get
      security:
      - HTTPBearer: []
      parameters:
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ГГГГ-ММ; по умолчанию — текущий месяц
          title: Month
        description: ГГГГ-ММ; по умолчанию — текущий месяц
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
          title: Team Id
        description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarMonthOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/budgets:
    get:
      tags:
      - budgets
      summary: Бюджеты на месяц и на год по валютам
      operationId: list_budgets_api_v1_budgets_get
      security:
      - HTTPBearer: []
      parameters:
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: 2000
          - type: 'null'
          description: По умолчанию — текущий год
          title: Year
        description: По умолчанию — текущий год
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          description: По умолчанию — текущий месяц
          title: Month
        description: По умолчанию — текущий месяц
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
          title: Team Id
        description: Команда. Пользователю — только своя (чужая — 403); администратору — фильтр, без него все
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetItem-Output'
                title: Response List Budgets Api V1 Budgets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - budgets
      summary: Задать бюджеты (только администратор)
      description: 'Передайте список бюджетов: существующие обновляются, новые создаются.'
      operationId: save_budgets_api_v1_budgets_put
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BudgetItem-Input'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetItem-Output'
                title: Response Save Budgets Api V1 Budgets Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{occurrence_id}/attachments:
    get:
      tags:
      - attachments
      summary: Чеки и ссылки, прикреплённые к оплате
      operationId: list_attachments_api_v1_payment_occurrences__occurrence_id__attachments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Occurrence Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentOut'
                title: Response List Attachments Api V1 Payment Occurrences  Occurrence Id  Attachments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - attachments
      summary: Прикрепить к оплате чек (файл до UPLOAD_MAX_MB) или ссылку
      operationId: add_attachment_api_v1_payment_occurrences__occurrence_id__attachments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Occurrence Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, PNG, JPG, WebP
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
  /api/v1/attachments/{attachment_id}/download:
    get:
      tags:
      - attachments
      summary: Скачать файл чека
      operationId: download_api_v1_attachments__attachment_id__download_get
      security:
      - HTTPBearer: []
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
        '404':
          description: Вложение не найдено или это ссылка
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/attachments/{attachment_id}:
    delete:
      tags:
      - attachments
      summary: Удалить вложение (автор или администратор)
      operationId: delete_attachment_api_v1_attachments__attachment_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attachment Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit-logs:
    get:
      tags:
      - logs
      summary: Журнал входов и действий (администратор)
      operationId: audit_logs_api_v1_audit_logs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
