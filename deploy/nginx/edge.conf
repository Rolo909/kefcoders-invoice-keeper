# Внешний nginx на сервере: HTTPS с сертификатом Let's Encrypt, дальше — веб-панель (frontend:8080).
# Сертификат выпускается с --cert-name invoice-keeper, поэтому путь не зависит от IP или домена.

server {
  listen 80;
  server_name _;

  # Проверка Let's Encrypt при продлении сертификата (certbot --webroot).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/invoice-keeper/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/invoice-keeper/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 12m;  # чеки до 10 МБ
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location / {
    proxy_pass http://frontend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
