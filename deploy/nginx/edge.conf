# Внешний nginx на сервере: HTTPS с сертификатом Let's Encrypt, дальше — веб-панель (frontend:8080).
# Сертификат выпускается с --cert-name invoice-keeper, поэтому путь не зависит от IP или домена.

# Защита от флуда с одного IP: лишние запросы и соединения получают 429, до приложения не доходят.
# Запас большой — жюри может заходить с одного IP (общий Wi-Fi), а страница грузит десятки файлов сразу.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;  # подбор паролей
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req zone=per_ip burst=100 nodelay;
limit_conn conn_per_ip 50;
limit_req_status 429;
limit_conn_status 429;

# Медленные клиенты (slowloris) не держат соединения бесконечно.
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;

server {
  listen 80;
  server_name _;

  # Проверка Let's Encrypt при продлении сертификата (certbot --webroot).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/invoice-keeper/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/invoice-keeper/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 12m;  # чеки до 10 МБ
  keepalive_timeout 30s;  # на уровне http уже задан в nginx.conf образа
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  location = /api/v1/auth/login {
    limit_req zone=per_ip burst=100 nodelay;
    limit_req zone=login burst=60 nodelay;
    proxy_pass http://frontend:8080;
  }

  location / {
    proxy_pass http://frontend:8080;
  }
}
