name: invoice-keeper

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Задайте POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?Задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только localhost: для миграций и тестов с хоста.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Адрес БД собирается из POSTGRES_* — пароль задаётся в .env один раз.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - uploads:/data/uploads  # чеки, прикреплённые к оплатам
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Проверяет сроки и отправляет напоминания. Тот же образ, что и backend; стартует после миграций.
  worker:
    build: ./backend
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

  # Почтовый сервер-ловушка: письма с напоминаниями видны в веб-интерфейсе http://localhost:8025.
  # Для настоящей почты укажите в .env свой SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  pgdata:
  uploads:
