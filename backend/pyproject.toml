[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-keeper-backend"
version = "0.1.0"
description = "Invoice Keeper — напоминания о регулярных платежах (API, worker, Telegram-бот)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2.1",
    "aiogram>=3.15",
    "apscheduler>=3.10,<4",
    "httpx>=0.28",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.2",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "time-machine>=2.16",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма для проекта

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/conftest.py" = ["E402"]  # окружение задаётся до импорта приложения
"alembic/versions/**" = ["E501"]  # автогенерированные миграции

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # иначе папка alembic/ рядом принимается за локальный пакет

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
